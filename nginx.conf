server {
    listen       80;
    listen       [::]:80;
    server_name  _;
    root /usr/share/nginx/html;
    index index.html;
    
    # 启用 gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
    
    # 静态文件缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # API 反向代理到后端服务（使用 Docker 服务名）
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 增加超时时间，用于文件上传
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 支持大文件上传
        client_max_body_size 10M;
    }
    
    # 管理后台路径 - 使用 rewrite 重定向到 admin.html
    location = /admin {
        rewrite ^ /admin.html permanent;
    }
    
    # 管理后台嵌套路径 - 支持客户端路由
    location ~ ^/admin/ {
        add_header X-Matched-Location "admin-nested" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https: chrome-extension: moz-extension:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https: blob:; font-src 'self' data: https:; connect-src 'self' http://backend:3001 https: chrome-extension: moz-extension:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        try_files /admin.html =404;
    }
    
    # 禁用目录索引，避免403错误
    autoindex off;
    
    # 处理尾部斜杠：重定向所有带尾部斜杠的路径到不带斜杠的版本
    location ~ ^/(.+)/$ {
        autoindex off;
        return 301 /$1;
    }
    
    # 主页面 - 改进路径处理，避免403错误
    location / {
        # 特殊处理：管理后台嵌套路径直接重写为 admin.html（必须在最前面）
        rewrite ^/admin/research-structure$ /admin.html last;
        rewrite ^/admin/expert-list$ /admin.html last;
        rewrite ^/admin/.+$ /admin.html last;
        
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https: chrome-extension: moz-extension:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https: blob:; font-src 'self' data: https:; connect-src 'self' http://backend:3001 https: chrome-extension: moz-extension:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
        
        # 尝试文件，如果不存在则返回 index.html（用于客户端路由）
        try_files $uri.html $uri /index.html;
    }
    
    # 处理 HTML 文件
    location ~ \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https: chrome-extension: moz-extension:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https: blob:; font-src 'self' data: https:; connect-src 'self' http://backend:3001 https: chrome-extension: moz-extension:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
    }
    
    # 404 处理
    error_page 404 /404.html;
    
    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
