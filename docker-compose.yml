version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_PATH: ${BASE_PATH:-}
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - BASE_PATH=${BASE_PATH:-}
      - NEXT_PUBLIC_API_URL=http://backend:3001
    restart: unless-stopped
    networks:
      - sgc-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3001:3001"
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
    environment:
      - PORT=3001
      - HOST=0.0.0.0
    restart: unless-stopped
    networks:
      - sgc-network

networks:
  sgc-network:
    driver: bridge

volumes:
  backend-data:
  backend-uploads:
